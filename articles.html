<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章 · GitHub 热门项目排行榜</title>
<meta name="description" content="这里收录站长的文章：GitHub 榜单背后的数据、Cloudflare Worker 的用法、以及做这个站踩过的坑。">
<link rel="canonical" href="https://github.661026.xyz/articles">
<meta property="og:type" content="website">
<meta property="og:title" content="文章 · GitHub 热门项目排行榜">
<meta property="og:description" content="这里收录站长的文章：GitHub 榜单背后的数据、Cloudflare Worker 的用法、以及做这个站踩过的坑。">
<meta property="og:url" content="https://github.661026.xyz/articles">
<meta property="og:image" content="https://github.661026.xyz/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://github.661026.xyz/og-image.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/js/md.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e5e9f2;
  --brand:#2563eb;--brand-soft:#eef4ff;--chip:#f1f5f9;--shadow:0 12px 30px rgba(15,23,42,.07);
  --radius:18px;--gap:18px;
}
body.dark{
  --bg:#0b1120;--card:#111a2e;--text:#e7ecf5;--muted:#93a1b8;--border:#1e2b45;
  --brand:#60a5fa;--brand-soft:#16233c;--chip:#16233c;--shadow:0 14px 34px rgba(0,0,0,.45);
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{padding:34px 0 70px}
.hero{padding:14px 0 26px;border-bottom:1px dashed var(--border);margin-bottom:26px}
.hero h1{margin:0 0 10px;font-size:clamp(26px,3.6vw,40px);line-height:1.2;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 18px;min-width:118px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:-.4px}
.stat span{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;min-height:44px;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:13px;background:var(--card);color:var(--text);font:inherit;font-size:14.5px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cat{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted);cursor:pointer;transition:.16s}
.cat:hover{color:var(--brand);border-color:var(--brand)}
.cat.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cat .n{opacity:.75;margin-left:6px;font-size:11.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--gap)}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;overflow:hidden}
.card::after{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--brand),transparent);opacity:0;transition:.16s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 45%,var(--border));box-shadow:0 18px 40px rgba(37,99,235,.14)}
.card:hover::after{opacity:1}
.card h2{margin:0 0 8px;font-size:18px;line-height:1.4;letter-spacing:-.2px}
.card .sum{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 14px;flex:1}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:auto}
.tag{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:5px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:999px;padding:2px 10px;font-size:12px}
body.dark .lock{background:#2a1a10;border-color:#7c2d12;color:#fdba74}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.skel{height:168px;border-radius:var(--radius);background:linear-gradient(90deg,var(--chip),color-mix(in srgb,var(--chip) 60%,var(--card)),var(--chip));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
dialog{border:0;padding:0;border-radius:22px;background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(2,6,23,.4)}
dialog::backdrop{background:rgba(2,6,23,.55);backdrop-filter:blur(3px)}
.reader{width:min(880px,calc(100% - 20px));max-height:92vh;display:flex;flex-direction:column}
.reader-top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:22px 22px 0 0;z-index:2}
.reader-top .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .1s}
.reader-body{overflow:auto;padding:26px 34px 34px;font-size:15.5px}
.reader-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:18px}
.reader h1,.reader h2,.reader h3{letter-spacing:-.3px}
.unlock{width:min(420px,calc(100% - 28px));padding:26px}
.unlock h3{margin:0 0 6px;font-size:19px}
.unlock p{margin:0 0 16px;color:var(--muted);font-size:14px}
.unlock input{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;outline:none}
.unlock input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.unlock .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.err{color:#dc2626;font-size:13px;margin-top:10px;min-height:18px}
footer{border-top:1px solid var(--border);padding:26px 0 40px;color:var(--muted);font-size:13px}
@media (max-width:640px){
  .wrap{width:calc(100% - 22px)}
  .grid{grid-template-columns:1fr}
  .reader-body{padding:20px 18px 28px}
  .hero h1{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <a class="brand" href="/"><span class="dot"></span>GitHub 热门项目排行榜</a>
    <div class="head-actions">
      <a class="btn" href="/">← 回榜单</a>
      <a class="btn" href="/?page=nav">导航</a>
      <button class="btn" id="btnTheme" type="button">切换主题</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>文章</h1>
    <p>这里放站长写的东西：榜单背后的数据口径、Cloudflare Worker 的折腾记录，以及做这个站踩过的坑。加密文章需要输入密码才能看正文。</p>
    <div class="stats">
      <div class="stat"><b id="stCount">—</b><span>篇文章</span></div>
      <div class="stat"><b id="stCats">—</b><span>个分类</span></div>
      <div class="stat"><b id="stLast">—</b><span>最近更新</span></div>
    </div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="搜索标题、摘要、标签…" autocomplete="off">
    </label>
    <button class="btn" id="btnSort" type="button">最新在前</button>
  </div>

  <div class="cats" id="cats"></div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <div class="empty" id="empty" hidden>没有匹配的文章</div>
</main>

<footer class="wrap">
  <span>数据与文章由站长维护 · </span><a href="/">返回首页</a>
</footer>

<dialog class="reader" id="reader">
  <div class="reader-top">
    <span class="t" id="rTitle">阅读</span>
    <button class="btn" id="rClose" type="button">关闭</button>
  </div>
  <div class="progress"><i id="rBar"></i></div>
  <div class="reader-body" id="rBody"></div>
</dialog>

<dialog class="unlock" id="unlock">
  <h3>这篇文章加密了</h3>
  <p id="uDesc">输入密码后查看正文。</p>
  <input id="uPwd" type="password" placeholder="文章密码" autocomplete="off">
  <div class="err" id="uErr"></div>
  <div class="row">
    <button class="btn" id="uCancel" type="button">取消</button>
    <button class="btn primary" id="uGo" type="button">解锁</button>
  </div>
</dialog>

<script src="/js/md.js"></script>
<script>
(function () {
  var THEME_KEY = 'ghrankTheme';
  var $ = function (id) { return document.getElementById(id); };
  var state = { all: [], cat: '', q: '', desc: true, loading: false };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function paintTheme() {
    var t = 'light';
    try { t = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}
    document.body.classList.toggle('dark', t === 'dark');
  }
  $('btnTheme').addEventListener('click', function () {
    var dark = !document.body.classList.contains('dark');
    document.body.classList.toggle('dark', dark);
    try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
  });
  paintTheme();

  function dateText(a) {
    return (a && a.date) ? String(a.date) : '';
  }

  function catOf(a) {
    return (a && a.category ? String(a.category) : '').trim();
  }

  function sortList() {
    state.all.sort(function (x, y) {
      var dx = String(x.date || ''), dy = String(y.date || '');
      if (dx === dy) return String(y.id).localeCompare(String(x.id));
      return state.desc ? dy.localeCompare(dx) : dx.localeCompare(dy);
    });
  }

  function renderCats() {
    var map = {};
    state.all.forEach(function (a) {
      var c = catOf(a) || '未分类';
      map[c] = (map[c] || 0) + 1;
    });
    var names = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; });
    var html = '<button class="cat' + (state.cat === '' ? ' on' : '') + '" data-cat="">全部<span class="n">' + state.all.length + '</span></button>';
    names.forEach(function (n) {
      html += '<button class="cat' + (state.cat === n ? ' on' : '') + '" data-cat="' + esc(n) + '">' + esc(n) + '<span class="n">' + map[n] + '</span></button>';
    });
    $('cats').innerHTML = names.length ? html : '';
    $('stCats').textContent = names.length ? String(names.length) : '0';
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return state.all.filter(function (a) {
      var c = catOf(a) || '未分类';
      if (state.cat && c !== state.cat) return false;
      if (!q) return true;
      var hay = [a.title, a.summary, (a.tags || []).join(' '), c].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }

  function renderList() {
    var list = filtered();
    $('empty').hidden = list.length > 0 || state.loading;
    $('grid').innerHTML = list.map(function (a) {
      var tags = (a.tags || []).slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var lock = a.locked ? '<span class="lock">🔒 需要密码</span>' : '';
      var cat = catOf(a);
      return '<article class="card" data-id="' + esc(a.id) + '">' +
        '<h2>' + esc(a.title || '无标题') + '</h2>' +
        '<p class="sum">' + esc(a.summary || '（没有摘要）') + '</p>' +
        '<div class="meta">' + (cat ? '<span class="tag">' + esc(cat) + '</span>' : '') + tags + lock +
        '<span style="margin-left:auto">' + esc(dateText(a)) + '</span></div>' +
        '</article>';
    }).join('');
  }

  function paintStats() {
    $('stCount').textContent = String(state.all.length);
    var last = state.all.map(function (a) { return String(a.date || ''); }).sort().pop() || '—';
    $('stLast').textContent = last || '—';
  }

  function load() {
    state.loading = true;
    fetch('/data/articles.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(0); })
      .catch(function () {
        return fetch('/api/articles').then(function (r) { return r.ok ? r.json() : { articles: [] }; }).then(function (j) { return j.articles || []; });
      })
      .then(function (data) {
        state.all = Array.isArray(data) ? data : (data.articles || []);
        state.loading = false;
        sortList();
        paintStats();
        renderCats();
        renderList();
        openFromHash();
      })
      .catch(function () {
        state.loading = false;
        state.all = [];
        renderList();
        $('empty').hidden = false;
        $('empty').textContent = '文章加载失败，稍后刷新试试';
      });
  }

  var current = null;

  function openReader(a, body) {
    current = a;
    $('rTitle').textContent = a.title || '阅读';
    var cat = catOf(a);
    var head = '<div class="reader-meta">' +
      (cat ? '<span class="tag">' + esc(cat) + '</span>' : '') +
      (a.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span>' + esc(dateText(a)) + '</span>' +
      (a.locked ? '<span class="lock">🔒 已验证密码</span>' : '') + '</div>';
    var html = '';
    if (window.KeeMd && window.KeeMd.render) html = window.KeeMd.render(body || '');
    else html = '<pre>' + esc(body || '') + '</pre>';
    $('rBody').innerHTML = head + html;
    $('rBody').scrollTop = 0;
    updateBar();
    var dlg = $('reader');
    if (!dlg.open) dlg.showModal();
    try { history.replaceState(null, '', '/articles#' + encodeURIComponent(a.id)); } catch (e) {}
  }

  function updateBar() {
    var el = $('rBody');
    if (!el) return;
    var max = el.scrollHeight - el.clientHeight;
    var p = max > 0 ? Math.min(100, Math.round(el.scrollTop / max * 100)) : 100;
    $('rBar').style.width = p + '%';
  }
  $('rBody').addEventListener('scroll', updateBar);

  function closeReader() {
    var dlg = $('reader');
    if (dlg.open) dlg.close();
    current = null;
    try { history.replaceState(null, '', '/articles'); } catch (e) {}
  }
  $('rClose').addEventListener('click', closeReader);
  $('reader').addEventListener('click', function (e) { if (e.target === $('reader')) closeReader(); });

  var pending = null;

  function askUnlock(a) {
    pending = a;
    $('uDesc').textContent = '《' + (a.title || '这篇文章') + '》需要密码才能查看正文。';
    $('uPwd').value = '';
    $('uErr').textContent = '';
    var dlg = $('unlock');
    if (!dlg.open) dlg.showModal();
    setTimeout(function () { $('uPwd').focus(); }, 60);
  }

  function tryUnlock() {
    var pwd = $('uPwd').value;
    if (!pending) return;
    if (!pwd) { $('uErr').textContent = '先输入密码'; return; }
    $('uGo').disabled = true;
    $('uGo').textContent = '验证中…';
    fetch('/api/article', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: pending.id, password: pwd }),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        $('uGo').disabled = false;
        $('uGo').textContent = '解锁';
        if (!res.j || !res.j.ok) {
          $('uErr').textContent = (res.j && res.j.error) || '密码不对';
          return;
        }
        var a = pending;
        pending = null;
        $('unlock').close();
        openReader(a, res.j.body || '');
      })
      .catch(function () {
        $('uGo').disabled = false;
        $('uGo').textContent = '解锁';
        $('uErr').textContent = '网络出问题了，再试一次';
      });
  }
  $('uGo').addEventListener('click', tryUnlock);
  $('uPwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
  $('uCancel').addEventListener('click', function () { pending = null; $('unlock').close(); });

  function openById(id) {
    var a = state.all.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!a) return;
    if (a.locked) { askUnlock(a); return; }
    if (a.body) { openReader(a, a.body); return; }
    fetch('/api/article', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: a.id, password: '' }),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) openReader(a, j.body || '');
        else if (a.locked) askUnlock(a);
      })
      .catch(function () { openReader(a, ''); });
  }

  function openFromHash() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (id) openById(id);
  }

  $('grid').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    openById(card.getAttribute('data-id'));
  });

  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.cat');
    if (!b) return;
    state.cat = b.getAttribute('data-cat') || '';
    renderCats();
    renderList();
  });

  var qt = 0;
  $('q').addEventListener('input', function (e) {
    state.q = e.target.value || '';
    clearTimeout(qt);
    qt = setTimeout(renderList, 90);
  });

  $('btnSort').addEventListener('click', function () {
    state.desc = !state.desc;
    $('btnSort').textContent = state.desc ? '最新在前' : '最早在前';
    sortList();
    renderList();
  });

  window.addEventListener('hashchange', openFromHash);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('reader').open) closeReader();
      if ($('unlock').open) { pending = null; $('unlock').close(); }
    }
  });

  load();
})();
</script>
</body>
</html>
