<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0b429">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>文章 - GitHub 热门项目排行榜</title>
<meta name="description" content="GitHub 热门项目排行榜的文章列表，逐条收录榜单解读与开源项目观察。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://github-rank.xiaoh2018.workers.dev/articles">
<style>
:root{--bg:#faf7f0;--card:#ffffff;--text:#1c2230;--muted:#6b7280;--border:#e5e0d4;--accent:#b07d10;--gold:#f0b429;--shadow:0 1px 2px rgba(28,34,48,.06),0 8px 24px -16px rgba(28,34,48,.25);--radius:12px;--radius-sm:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:20px;margin:0}
header nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--text);text-decoration:none;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item{padding:12px 16px;border-top:1px solid var(--border);min-width:0}
.item:first-child{border-top:0}
.item h2{font-size:15px;margin:0 0 2px;overflow-wrap:anywhere}
.meta{margin:0;font-size:12px;color:var(--muted);font-family:Consolas,ui-monospace,monospace}
.summary{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:13px;min-height:28px;display:flex;align-items:center}
.body{font-size:13px}
.body p,.body li{margin:6px 0;line-height:1.7;overflow-wrap:anywhere}
.body h2,.body h3,.body h4{font-size:14px;margin:12px 0 4px}
.body img{max-width:100%;height:auto;border-radius:6px;display:block;margin:8px 0}
.body pre{overflow:auto;background:#f5f1e6;padding:8px;border-radius:6px;font-size:12px}
.body code{background:#f5f1e6;padding:0 4px;border-radius:4px;font-size:12px}
.body blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--gold);color:var(--muted)}
.body ul,.body ol{padding-left:20px;margin:6px 0}
.body a{color:var(--accent)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.error{color:#c2402f}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文章</h1>
    <nav>
      <a class="btn" href="/">返回排行榜</a>
    </nav>
  </header>
  <main class="list" id="list" aria-live="polite">
    <p class="empty">加载中…</p>
  </main>
</div>
<script src="js/md.js"></script>
<script>
(function(){
  var list=document.getElementById('list');
  function str(v){ return v==null?'':String(v).trim(); }
  function fillParas(el,text){
    String(text).split(/\n{2,}/).forEach(function(part){
      var p=document.createElement('p');
      p.textContent=part.trim();
      if(p.textContent) el.appendChild(p);
    });
  }
  function showEmpty(msg,isErr){
    var p=document.createElement('p');
    p.className=isErr?'empty error':'empty';
    p.textContent=msg;
    list.replaceChildren(p);
  }
  function render(items){
    var arr=Array.isArray(items)?items.filter(function(it){ return it&&str(it.title); }):[];
    if(!arr.length){ showEmpty('还没有文章。'); return; }
    arr.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
    var frag=document.createDocumentFragment();
    arr.forEach(function(it){
      var art=document.createElement('article');
      art.className='item';
      var h=document.createElement('h2');
      h.textContent=str(it.title);
      art.appendChild(h);
      var date=str(it.date);
      if(date){
        var meta=document.createElement('p');
        meta.className='meta';
        var tm=document.createElement('time');
        tm.setAttribute('datetime',date);
        tm.textContent=date;
        meta.appendChild(tm);
        art.appendChild(meta);
      }
      var sum=str(it.summary);
      if(sum){
        var sp=document.createElement('p');
        sp.className='summary';
        sp.textContent=sum;
        art.appendChild(sp);
      }
      var body=String(it.body||'');
      if(body.trim()){
        var det=document.createElement('details');
        var ds=document.createElement('summary');
        ds.textContent='阅读全文';
        var bd=document.createElement('div');
        bd.className='body';
        if(window.KeeMd) bd.innerHTML=KeeMd.render(body); else fillParas(bd,body);
        det.appendChild(ds);
        det.appendChild(bd);
        art.appendChild(det);
      }
      frag.appendChild(art);
    });
    list.replaceChildren(frag);
  }
  fetch('/data/articles.json',{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render)
    .catch(function(){ showEmpty('文章暂时无法加载，请稍后再试。',true); });
})();
</script>
</body>
</html>
