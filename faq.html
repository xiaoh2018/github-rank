<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>常见问答 · GitHub 热门项目排行榜</title>
<meta name="description" content="关于 GitHub 热门项目排行榜的常见问题：数据从哪来、多久更新一次、收录与提交方式、密码文章怎么解锁、如何联系站长。">
<link rel="canonical" href="https://github.661026.xyz/faq">
<link rel="alternate" type="application/rss+xml" title="文章 RSS" href="https://github.661026.xyz/rss.xml">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#faf7f0; --card:#fffdf8; --fg:#33291c; --muted:#7a6b56; --line:#e8e0cf;
  --accent:#b07d10; --accent-soft:#f6eddc; --chip:#f3ecdc; --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px rgba(60,45,20,.05);
  --gap:16px; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15130f; --card:#1e1a14; --fg:#f0e9dc; --muted:#a99a82; --line:#332c22; --accent:#e0b457; --accent-soft:#2a2419; --chip:#241f17; --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:18px 0 10px}
.brand{font-size:17px;font-weight:800;color:var(--fg);letter-spacing:.2px}
.mainnav{display:flex;gap:6px;justify-self:center;flex-wrap:wrap}
.mnav{display:inline-flex;align-items:center;min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13.5px}
.mnav:hover{color:var(--fg);text-decoration:none}
.mnav.is-on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.head-actions{display:flex;gap:8px;justify-self:end;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
@media (max-width:760px){ header{grid-template-columns:1fr;gap:10px} .mainnav{justify-self:start} .head-actions{justify-self:start;flex-wrap:wrap} }
.hero{padding:8px 0 20px}
h1{font-size:26px;margin:6px 0 8px;letter-spacing:-.3px}
.lead{color:var(--muted);margin:0;max-width:760px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
#q{flex:1 1 280px;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(176,125,16,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}
.chip{padding:4px 12px;border-radius:999px;background:var(--chip);border:1px solid transparent;color:var(--muted);font-size:12.5px;cursor:pointer}
.chip.is-on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
#expandAll{margin-left:auto;border-color:var(--line);background:var(--card)}
.qalist{display:grid;gap:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:0;overflow:hidden}
.qa[open]{border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.07)}
.qa summary .qlink{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:1px 7px;font:600 11.5px/1.7 Consolas,ui-monospace,monospace;cursor:pointer;opacity:.7;white-space:nowrap}
.qa summary .qlink:hover{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--card)}
.qa summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:700;font-size:15px;display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 18px;gap:10px;align-items:center}
.qa summary:hover{background:var(--accent-soft)}
.qa[open] summary{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.qa summary>span.qtext{min-width:0;overflow-wrap:anywhere;line-height:1.5}
.qa summary::-webkit-details-marker{display:none}
.qa summary:before{content:"Q";width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;opacity:.9}
.qa summary:after{content:"+";grid-column:5;justify-self:end;color:var(--muted);font-weight:700;font-size:16px;line-height:1}
.qa[open] summary:after{content:"−";color:var(--accent)}
.chip b{font-weight:700;opacity:.62;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.is-empty{opacity:.45}
.chip.is-empty:hover{opacity:.7}
.qa .hitmark{background:rgba(203,145,32,.30);color:inherit;border-radius:3px;padding:0 1px}
html[data-theme="ink"] .qa .hitmark{background:rgba(240,190,90,.32)}

.qa .ans{padding:14px 20px 18px 52px;color:var(--fg);font-size:14.5px;line-height:1.75}
.qa .ans p{margin:0 0 10px}
.qa .ans ul,.qa .ans ol{margin:0 0 10px;padding-left:22px}
.qa .ans code{background:var(--chip);border-radius:5px;padding:1px 5px;font-size:13px}
.qa .ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.qa .ans th,.qa .ans td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.qa .ans a{word-break:break-all}
.qtag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:2px 9px;white-space:nowrap}
.note{color:var(--muted);font-size:13px;margin-top:22px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.empty{color:var(--muted);padding:22px 0}

/* ---- 多主题 ---- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
html[data-theme="ink"]{
  --bg:#08090b;--card:#101216;--fg:#e8ecf4;--muted:#8b93a7;
  --line:#1e222b;--accent:#6e79d6;--accent-soft:#171a22;--chip:#171a22;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -22px rgba(0,0,0,.7);
}
html[data-theme="ink"]{color-scheme:dark}
html[data-theme="stripe"]{
  --bg:#ffffff;--card:#ffffff;--fg:#0a2540;--muted:#425466;
  --line:#e3e8ee;--accent:#635bff;--accent-soft:#f6f9fc;--chip:#f6f9fc;
  --shadow:0 1px 2px rgba(10,37,64,.06),0 12px 28px -18px rgba(10,37,64,.28);
}
html[data-theme="notion"]{
  --bg:#f7f6f3;--card:#ffffff;--fg:#37352f;--muted:#787774;
  --line:#e9e7e2;--accent:#2f6feb;--accent-soft:#efeee9;--chip:#efeee9;
  --shadow:0 1px 2px rgba(55,53,47,.06),0 10px 26px -18px rgba(55,53,47,.22);
}
    .totop{position:fixed;right:16px;bottom:16px;z-index:29;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s ease,color .15s ease}
    .totop:hover{transform:translateY(-2px);color:var(--accent)}
    .totop[hidden]{display:none}
    @media print{.totop{display:none!important}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">GitHub 热门项目排行榜</a>
    <nav class="mainnav" aria-label="主导航">
      <a class="mnav" href="/">榜单</a>
      <a class="mnav" href="/?page=nav">导航</a>
      <a class="mnav" href="/articles">文章</a>
      <a class="mnav is-on" href="/faq" aria-current="page">问答</a>
    </nav>
    <div class="head-actions">
      <a class="btn" href="/">← 回榜单</a>
    </div>
  </header>

  <section class="hero">
    <h1>常见问答</h1>
    <p class="lead" id="intro">关于本站的高频问题：数据从哪来、多久更新、怎么被收录、加密文章怎么解锁。</p>
    <div class="tools">
      <input id="q" type="search" placeholder="搜索问题或关键词，例如「更新」「收录」「密码」" autocomplete="off">
      <span class="note" id="count" style="margin:0"></span>
      <button type="button" class="chip" id="expandAll" data-open="0">展开全部</button>
    </div>
    <div class="chips" id="tags"></div>
  </section>

  <main class="qalist" id="list">
    <div class="qa"><summary>加载中…</summary></div>
  </main>

  <p class="note">找不到答案？把问题发到 <a href="https://github.com/xiaoh2018/github-rank/issues" target="_blank" rel="noopener">GitHub Issues</a>，或直接用「关于本站」里的联系方式。</p>

  <footer>
    <span>数据来自 GitHub API，每 3 小时自动更新</span>
    <a href="/articles">文章</a>
    <a href="/?page=nav">导航</a>
    <a href="/sitemap.xml">站点地图</a>
    <a href="/llms.txt">llms.txt</a>
    <a href="/rss.xml">RSS</a>
  </footer>
</div>

<script>
(function () {
  var QA = { intro: '', items: [] };
  var tag = 'all';

  // 标签与关键词写进 URL：分享「收录 里搜 sitemap」这种组合时对方看到的是同一屏
  function readUrlFilters() {
    var p = new URLSearchParams(location.search);
    var t = p.get('tag') || 'all';
    tag = t;
    var box = document.getElementById('q');
    if (box) box.value = p.get('q') || '';
  }

  function syncUrl(push) {
    var p = new URLSearchParams(location.search);
    var kw = ((document.getElementById('q') || {}).value || '').trim();
    function set(k, v) { if (v) p.set(k, v); else p.delete(k); }
    set('tag', tag && tag !== 'all' ? tag : '');
    set('q', kw);
    var qs = p.toString();
    var url = location.pathname + (qs ? '?' + qs : '') + location.hash;
    try { history[push ? 'pushState' : 'replaceState'](null, '', url); } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 极简 Markdown：段落 / 列表 / 粗体 / 行内代码 / 链接 / 表格
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function md(src) {
    var lines = String(src || '').replace(/\r/g, '').split('\n');
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1])) {
        var head = line.split('|').map(function (c) { return c.trim(); });
        head = head.slice(1, head.length - 1);
        var rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          var cells = lines[i].split('|').map(function (c) { return c.trim(); });
          rows.push(cells.slice(1, cells.length - 1));
          i++;
        }
        out.push('<table><thead><tr>' + head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
        out.push('<ul>' + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }
      if (!line.trim()) { i++; continue; }
      var buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\|/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
    return out.join('');
  }

  function matches(it, kw) {
    if (!kw) return true;
    var s = (it.q + ' ' + it.a + ' ' + (it.tag || '')).toLowerCase();
    return kw.split(/\s+/).every(function (w) { return s.indexOf(w) >= 0; });
  }

  // 在已渲染好的 DOM 里给命中词加 <mark>：只动文本节点，不会破坏 markdown 生成的标签
  function highlightNode(root, kw) {
    if (!kw) return;
    var words = kw.split(/\s+/).filter(Boolean);
    if (!words.length) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) {
      if (!n.nodeValue || !n.nodeValue.trim()) continue;
      if (n.parentNode && n.parentNode.nodeName === 'MARK') continue;
      nodes.push(n);
    }
    nodes.forEach(function (node) {
      var txt = node.nodeValue, low = txt.toLowerCase(), ranges = [];
      words.forEach(function (w) {
        var at = 0, i;
        while ((i = low.indexOf(w, at)) !== -1) { ranges.push([i, i + w.length]); at = i + w.length; }
      });
      if (!ranges.length) return;
      ranges.sort(function (a, b) { return a[0] - b[0]; });
      var merged = [];
      ranges.forEach(function (r) {
        var last = merged[merged.length - 1];
        if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
        else merged.push([r[0], r[1]]);
      });
      var frag = document.createDocumentFragment(), pos = 0;
      merged.forEach(function (r) {
        if (r[0] > pos) frag.appendChild(document.createTextNode(txt.slice(pos, r[0])));
        var m = document.createElement('mark');
        m.className = 'hitmark';
        m.textContent = txt.slice(r[0], r[1]);
        frag.appendChild(m);
        pos = r[1];
      });
      if (pos < txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function render() {
    var kw = (document.getElementById('q').value || '').trim().toLowerCase();
    var list = QA.items.filter(function (it) {
      if (tag !== 'all' && (it.tag || '') !== tag) return false;
      return matches(it, kw);
    });
    var box = document.getElementById('list');
    if (!list.length) {
      box.innerHTML = '<div class="empty">没有匹配的问题，换个关键词试试。</div>';
    } else {
      box.innerHTML = list.map(function (it, i) {
        var no = QA.items.indexOf(it) + 1;
        return '<details class="qa" id="q-' + no + '"' + (i === 0 ? ' open' : '') + '>' +
          '<summary><span class="qtext">' + esc(it.q) + '</span>' + (it.tag ? '<span class="qtag">' + esc(it.tag) + '</span>' : '') +
          '<button type="button" class="qlink" data-qcopy="' + no + '" title="复制这一条的直达链接">#' + no + '</button></summary>' +
          '<div class="ans">' + md(it.a) + '</div></details>';
      }).join('');
    }
    highlightNode(box, kw);
    renderTags(kw);
    document.getElementById('count').textContent = kw
      ? '共 ' + QA.items.length + ' 条，命中 ' + list.length + ' 条'
      : '共 ' + QA.items.length + ' 条，当前显示 ' + list.length + ' 条';
  }

  var expandBtn = document.getElementById('expandAll');
  if (expandBtn) {
    expandBtn.addEventListener('click', function () {
      var openAll = expandBtn.getAttribute('data-open') !== '1';
      Array.prototype.forEach.call(document.querySelectorAll('details.qa'), function (d) { d.open = openAll; });
      expandBtn.setAttribute('data-open', openAll ? '1' : '0');
      expandBtn.textContent = openAll ? '收起全部' : '展开全部';
    });
  }

  function renderTags(kw) {
    var tags = [];
    QA.items.forEach(function (it) { if (it.tag && tags.indexOf(it.tag) < 0) tags.push(it.tag); });
    var box = document.getElementById('tags');
    if (!tags.length) { box.hidden = true; return; }
    box.hidden = false;
    // 计数按「关键词命中的条目」算，而不是全量：搜索时看到的数字要和列表一致；
    // 同时不按当前选中的标签过滤，否则切到某个标签后其它标签全变 0，没法判断该切去哪
    var pool = QA.items.filter(function (it) { return matches(it, kw || ''); });
    var counts = { all: pool.length };
    pool.forEach(function (it) { var k = it.tag || ''; if (k) counts[k] = (counts[k] || 0) + 1; });
    box.innerHTML = ['all'].concat(tags).map(function (t) {
      var n = counts[t] || 0;
      var cls = 'chip' + (t === tag ? ' is-on' : '') + (kw && !n ? ' is-empty' : '');
      return '<button type="button" class="' + cls + '" data-tag="' + esc(t) + '"' + (kw && !n ? ' aria-disabled="true"' : '') + '>' + (t === 'all' ? '全部' : esc(t)) + '<b>' + n + '</b></button>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-qcopy]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var url = location.origin + '/faq#q-' + b.getAttribute('data-qcopy');
    var done = function () { b.textContent = '✓ 已复制'; setTimeout(function () { b.textContent = '# ' + b.getAttribute('data-qcopy'); }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
  });

  window.addEventListener('popstate', function () { readUrlFilters(); render(); });

  function openFromHash() {
    // 打印/存 PDF 前把折叠全展开，否则 Chrome 只打印已展开的那条
  window.addEventListener('beforeprint', function () {
    Array.prototype.forEach.call(document.querySelectorAll('details.qa'), function (d) { d.open = true; });
  });
  var m = /^#q-(\d+)$/.exec(location.hash || '');
    if (!m) return;
    var d = document.getElementById('q-' + m[1]);
    if (d) { d.open = true; d.scrollIntoView({ block: 'center' }); }
  }

  document.getElementById('tags').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]');
    if (!b) return;
    tag = b.getAttribute('data-tag');
    syncUrl(true);
    render();
  });
  document.getElementById('q').addEventListener('input', function () { syncUrl(false); render(); });

  // 主题：跟随站点默认，访客在其他页面选过就沿用（与首页一致）
  var THEME_KEY = 'ghrank-theme';
  var THEMES = ['paper', 'ink', 'stripe', 'notion'];
  var THEME_BG = { paper: '#faf7f0', ink: '#08090b', stripe: '#ffffff', notion: '#f7f6f3' };
  function applyTheme(t) {
    if (THEMES.indexOf(t) < 0) t = 'paper';
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector("meta[name=\"theme-color\"]");
    if (meta) meta.setAttribute("content", THEME_BG[t] || THEME_BG.paper);
  }
  fetch('/api/site', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var st = (j && j.site && j.site.theme) || { name: 'paper', allowUser: true };
      var saved = '';
      try { saved = localStorage.getItem(THEME_KEY) || ''; } catch (e) {}
      if (saved === 'light') saved = 'paper';
      if (saved === 'dark') saved = 'ink';
      var use = (st.allowUser !== false && THEMES.indexOf(saved) >= 0) ? saved : (st.name || 'paper');
      applyTheme(use);
    })
    .catch(function () { applyTheme('paper'); });

  fetch('/data/qa.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (qa) {
      QA = { intro: (qa && qa.intro) || '', items: (qa && qa.items) || [] };
      if (QA.intro) document.getElementById('intro').textContent = QA.intro;
      readUrlFilters();
      render();
    })
    .catch(function () {
      document.getElementById('list').innerHTML = '<div class="empty">问答数据没加载出来，稍后刷新再试。</div>';
    });
})();
  (function(){
    function initTotop(){
      var btn = document.getElementById('totop');
      if (!btn || btn.__bound) return;
      btn.__bound = true;
      var tick = function(){ btn.hidden = (window.scrollY || document.documentElement.scrollTop || 0) < 420; };
      window.addEventListener('scroll', tick, { passive: true });
      btn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
      tick();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initTotop);
    else initTotop();
  })();
</script>
<button class="totop" id="totop" type="button" aria-label="返回顶部" hidden>↑</button>
</body>
</html>
