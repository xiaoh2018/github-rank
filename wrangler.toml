# Cloudflare Worker 部署配置（wrangler）。
# 目的：让 GitHub Actions 能直接 `wrangler deploy`，省掉每次手粘代码。
# 凭据：仓库 Secrets 里配 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，
#       或者用仓库变量 CF_API_TOKEN / CF_ACCOUNT_ID（工作流支持两者，secrets 优先）。
name = "github-rank"
main = "worker.js"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "github.661026.xyz/*", zone_name = "661026.xyz" }
]

# ⚠️ wrangler deploy 会用本文件整体替换 Worker 的变量/绑定，漏写就会把线上配置清掉：
#    2026-11-25 就因为少了下面这两个变量，线上 REPO_OWNER/REPO_NAME 被清空，
#    站点立刻 503「还没配置 REPO_OWNER / REPO_NAME」。改这个文件时别删它们。
[vars]
REPO_OWNER = "xiaoh2018"
REPO_NAME = "github-rank"

# Workers AI 绑定（免费额度：每天 10,000 Neurons）。漏掉这一段同样会被 deploy 删掉，
# 翻译就只剩 MyMemory（无 Key，但按邮箱限额度）。
[ai]
binding = "AI"
