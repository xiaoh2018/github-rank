name: Update data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub ranking data
        run: node scripts/fetch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.js data/repos-meta.js data/repos-week.js data/repos-month.js data/repos-year.js data/repos-all.js data/desc-zh.json data/readme-zh.json
          if git diff --cached --quiet; then
            echo "No changes to data/, skip commit."
          else
            git commit -m "chore: update ranking data $(date -u +%F)"
            # 手动点「立即刷新」时，别的提交可能刚推到 main；先 rebase 再推，避免 non-fast-forward 失败
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push 失败，第 $i 次重试前同步远端…"
              sleep 5
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            done
          fi
